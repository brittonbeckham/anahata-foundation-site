{% assign base = '/assets/media' | relative_url %}
<div class="installations-carousel" tabindex="0" aria-roledescription="carousel" aria-label="Anahata installations" data-installations-carousel>
  <script type="application/json" data-installations-data>
[
  {"name":"Primary Yurt","category":"Facilitation","size":"27–30 ft · holds 25–30","image":"{{ base }}/yurt.jpg","body":"The main gathering and facilitation space of the Lower Meadow. A permanent, insulated structure from Colorado Yurt Company, built for year-round use with a wood-burning stove. Its circular form supports group coherence — it is the core classroom of the Mystery School and the primary site for larger ceremonies and retreats."},
  {"name":"Secondary Yurt","category":"Facilitation","size":"20–22 ft · holds 10–15","image":"{{ base }}/yurt-secondary-pending.jpg","body":"A smaller, Mongolian-style yurt — handmade with decorative wood and ropes, no nails or metal. The lower walls and 10ft center create an intimate setting for private session work, parallel small-group programming during retreats, and quiet containers for deeper inner exploration."},
  {"name":"Tipi","category":"Facilitation","size":"Open-air · earth-connected","image":"{{ base }}/tipi-pending.jpg","body":"An open-air, earth-connected space without insulation or permanent heating — well suited for seasonal circles, men's and women's groups, and teachings that draw on grounded, ancestral practices. Connects us to the ancestors of this land, where community-style gathering was commonplace less than two centuries ago."},
  {"name":"Moon Bath Cove","category":"Facilitation","size":"Riverside · crescent form","image":"{{ base }}/moon-bath-cove-pending.jpg","body":"A crescent-shaped cove with sandy beach and river rocks — formed by the great flood of 2013. Handmade thermal-siphon soaking baths arranged in a moon crescent, with a central altar made from a tree trunk recovered from the same flood. A potent area for moon-aligned ceremony, ritual release, and intentional life redirection."},
  {"name":"Riverside Sauna","category":"Facilitation","size":"Mobile · wood-fired","image":"{{ base }}/riverside-sauna-pending.jpg","body":"A wood-fired sauna set on a towable trailer — mobile so it can be positioned along the river's edge where flowing water supports nervous-system regulation, and so it stays compliant with county flood-zone restrictions. A gentle, powerful container for somatic unwinding and integration after ceremony."},
  {"name":"Ceremonial Firepit","category":"Facilitation","size":"Communal · ritual-aligned","image":"{{ base }}/fire-pit.jpg","body":"One of Anahata's central gathering points — designed for group work aligned with astrological timings, elemental cycles, and collective intention-setting. Fire here is a transformational element: a place to release outdated beliefs and emotional residue into the flames, and to ignite new pathways within."},
  {"name":"The Portal","category":"Facilitation","size":"Threshold installation","image":"{{ base }}/the-portal.png","body":"An active component of change. The Portal creates an environment where individuals can step through life's inflection points — what some call timeline shifts, or moments of death and rebirth — into a new reality. The more we shape our environment to our intention, the more charge our aligned action carries."},
  {"name":"Pavilion","category":"Facilitation","size":"Communal hub","image":"{{ base }}/pavilion-pending.jpg","body":"The central hub for communal connection — designed for shared meals, relaxed gatherings, and group conversation between sessions. With space for tables, seating, and simple utilities, the pavilion also supports educational activities, art projects, and informal workshops. A grounded, welcoming anchor point in the flow of retreats."},
  {"name":"Chakra Path","category":"Land Marker","size":"≈ 900 sq ft · built 2024","image":"{{ base }}/chakra-path-aerial.jpg","body":"An energy earth-work designed to clear the energy centers of an intention-centered person as they move through its focal points. Built in 2024 in collaboration with Karen of Energetic Geometry, it amplifies subtle energy through sacred solar geometry and underground water currents. Stones were sourced directly from the land."},
  {"name":"Labyrinth","category":"Land Marker","size":"Single inward path","image":"{{ base }}/labyrinth.png","body":"A meditative walking structure with one intentional path leading inward and back outward — its rhythm naturally slows the mind and synchronizes breath and movement. The spiral geometry mirrors patterns found in plants, shells, and galaxies. A contemplative threshold preparing individuals for ceremony, integration, or teachings elsewhere on the land."},
  {"name":"Zen Garden","category":"Land Marker","size":"Still-point · raked gravel","image":"{{ base }}/zen-garden-pending.jpg","body":"A still-point on the land — raked gravel, carefully placed stones, minimal natural elements. The patterns can be re-raked as an active meditation, allowing visitors to externalize their inner state through deliberate movement. Whether interacted with or simply observed, it offers a stable field of calm and presence."},
  {"name":"Stone Circle","category":"Land Marker","size":"Sandstone & granite rings","image":"{{ base }}/stone-circle.jpg","body":"A standing-stone installation drawn from both local sandstone and granite — Anahata sits precisely where the green granite of the Rockies rises out of an ancient red sandstone basin. The circle becomes a physical remembrance of this convergence: an intimate space for individuals or small groups to connect with the land's elemental intelligence."},
  {"name":"Geometry Garden","category":"Land Marker","size":"≈ 5,000 sq ft · walkable","image":"{{ base }}/geometry-garden.jpg","body":"A walkable teaching landscape encoding sacred shapes — spirals, circles, triangles — into the terrain itself through pathways and arrangements of stone, earth, and low-growing vegetation. Participants can feel how geometric principles influence movement, perception, and inner balance."},
  {"name":"Play Zone","category":"Play","size":"Natural materials · all ages","image":"{{ base }}/play-zone-pending.jpg","body":"A nature-based playground built from wood, rope, and natural materials — never plastics. Climbing structures, swings, balance elements, small interactive features. Children explore safely while adults reconnect with their own capacity for play. A dynamic learning environment for the world-schooling hub and youth programs."},
  {"name":"Zipline","category":"Play","size":"≈ 600 ft · across the land","image":"{{ base }}/zipline-pending.jpg","body":"A 600-foot zipline that lets guests engage the land from above — courage, motion, and thrill. For adults, a metaphor for confronting fears and overcoming challenges. For youth programs and retreats, a memorable experience that anchors a sense of wonder into their connection with this place."}
]
  </script>
