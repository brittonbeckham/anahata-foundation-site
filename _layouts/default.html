<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} — A New Earth Anchor in the Colorado Front Range{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Marcellus&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}" />
  {% feed_meta %}
  {% seo %}
</head>
<body>
  {% include nav.html %}
  {% include email-banner.html %}
  <main>
    {{ content }}
  </main>
  {% include footer.html %}

  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  {% if page.scripts %}
    {% for script in page.scripts %}
      <script src="{{ script | relative_url }}" defer></script>
    {% endfor %}
  {% endif %}
</body>
</html>
